requiredGateIds: [typecheck, lint, build, dependency-audit, responsive, content-integrity, accessibility, broken-links, metadata, security, integration-failure, release-certification]
gates:
  - { id: typecheck, category: TYPECHECK, state: PASS }
  - { id: lint, category: LINT, state: PASS }
  - { id: build, category: BUILD, state: PASS }
  - { id: dependency-audit, category: DEPENDENCY_AUDIT, state: PASS }
  - { id: responsive, category: RESPONSIVE, state: PASS }
  - { id: content-integrity, category: CONTENT_INTEGRITY, state: PASS }
  - { id: accessibility, category: ACCESSIBILITY, state: PASS }
  - { id: broken-links, category: BROKEN_LINKS, state: PASS }
  - { id: metadata, category: METADATA, state: PASS }
  - { id: security, category: SECURITY, state: PASS }
  - { id: integration-failure, category: INTEGRATION_FAILURE, state: PASS }
  - { id: release-certification, category: RELEASE_CERTIFICATION, state: PASS }
requiredBrowserIds: [chromium-desktop, chromium-responsive, safari-desktop, safari-responsive]
browsers:
  - { id: chromium-desktop, browser: CHROMIUM, mode: desktop, state: PASS, reason: null }
  - { id: chromium-responsive, browser: CHROMIUM, mode: responsive, state: PASS, reason: null }
  - { id: safari-desktop, browser: SAFARI, mode: desktop, state: PASS, reason: null }
  - { id: safari-responsive, browser: SAFARI, mode: representative responsive, state: PASS, reason: null }
allowDocumentedNonBlockers: true
responsiveMatrix: [320, 360, 390, 768, 1024, 1280, 1440]
accessibilityRequirements: [Keyboard operability, Visible focus, Reduced motion, Accessible names, Contrast]
contentIntegrity: true
releaseCertificationRequired: true
criticalRiskOverrideApprovalRef: null
